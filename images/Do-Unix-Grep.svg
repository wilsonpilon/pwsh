<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Do-Unix: exemplo de grep</title>
  <desc id="desc">Saída do Do-Unix filtrando linhas de exemplo que contêm PowerShell.</desc>
  <rect width="900" height="420" rx="14" fill="#0c111b"/>
  <path d="M14 0h872a14 14 0 0 1 14 14v38H0V14A14 14 0 0 1 14 0Z" fill="#1c2535"/>
  <circle cx="25" cy="26" r="7" fill="#ff5f57"/>
  <circle cx="49" cy="26" r="7" fill="#febc2e"/>
  <circle cx="73" cy="26" r="7" fill="#28c840"/>
  <text x="450" y="31" fill="#c6d0e0" font-family="Segoe UI, sans-serif" font-size="15" text-anchor="middle">PowerShell — Do-Unix.ps1</text>
  <g font-family="Cascadia Mono, Consolas, monospace" font-size="17">
    <text x="28" y="91" fill="#8bd5ca">PS C:\dos\pwsh&gt;</text>
    <text x="205" y="91" fill="#e6edf3">$lines | .\Do-Unix.ps1 grep -in 'powershell'</text>
    <text x="28" y="137" fill="#a6da95">1:PowerShell facilita tarefas repetitivas.</text>
    <text x="28" y="169" fill="#a6da95">3:Automacao com PowerShell.</text>
    <text x="28" y="231" fill="#8bd5ca">PS C:\dos\pwsh&gt;</text>
    <text x="205" y="231" fill="#e6edf3">$lines | .\Do-Unix.ps1 wc -lw</text>
    <text x="28" y="277" fill="#a6da95">3	11</text>
    <rect x="28" y="326" width="844" height="1" fill="#30394a"/>
    <text x="28" y="365" fill="#7f8ea3" font-size="14">Do-Unix.ps1 · grep e wc com entrada de exemplo</text>
  </g>
</svg>
