<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">SysInternals-Frontend: catálogo</title>
  <desc id="desc">Trecho do catálogo de ferramentas SysInternals exibido em modo texto.</desc>
  <rect width="900" height="420" rx="14" fill="#071b45"/>
  <path d="M14 0h872a14 14 0 0 1 14 14v38H0V14A14 14 0 0 1 14 0Z" fill="#1c2535"/>
  <circle cx="25" cy="26" r="7" fill="#ff5f57"/>
  <circle cx="49" cy="26" r="7" fill="#febc2e"/>
  <circle cx="73" cy="26" r="7" fill="#28c840"/>
  <text x="450" y="31" fill="#c6d0e0" font-family="Segoe UI, sans-serif" font-size="15" text-anchor="middle">PowerShell — SysInternals Frontend</text>
  <g font-family="Cascadia Mono, Consolas, monospace" font-size="16">
    <text x="28" y="88" fill="#70d7ff">PS C:\dos\pwsh&gt; .\SysInternals-Frontend.ps1 --List</text>
    <text x="28" y="141" fill="#fff4a3">Processos</text>
    <text x="48" y="178" fill="#ffffff">Autoruns</text>
    <text x="255" y="178" fill="#b9c9e8">Mostra tudo que e configurado para iniciar automaticamente...</text>
    <text x="48" y="210" fill="#ffffff">Handle</text>
    <text x="255" y="210" fill="#b9c9e8">Lista quais arquivos e objetos estao abertos por quais processos.</text>
    <text x="48" y="242" fill="#ffffff">Process Explorer</text>
    <text x="255" y="242" fill="#b9c9e8">Gerenciador de tarefas avancado.</text>
    <text x="28" y="296" fill="#fff4a3">Rede</text>
    <text x="48" y="333" fill="#ffffff">TCPView</text>
    <text x="255" y="333" fill="#b9c9e8">Mostra conexoes TCP/UDP e os processos associados.</text>
    <rect x="28" y="365" width="844" height="1" fill="#274574"/>
    <text x="28" y="394" fill="#8ea8d5" font-size="13">SysInternals-Frontend.ps1 · --List (trecho do catálogo)</text>
  </g>
</svg>
